name: pr-check

on:
  pull_request:

jobs:
  typecheck:
    name: Install + TypeScript type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Type-check (tsc --noEmit)
        run: npx --yes -p typescript@5.9.3 tsc --noEmit
